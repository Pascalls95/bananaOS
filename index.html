<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="menubar">
            <p style="margin-left: 20px;">bananaOS</p>
            <p id="timeElement" style="margin-right: 20px;">Time</p>
        </div>
        
        <div class="welcome">
            <h1>Welcome to bananaOS!</h1>
            <p>hello</p>
        </div>

        <script>
            function updateTime() {
                var currentTime = new Date().toLocaleString();
                var timeText = document.querySelector("#timeElement");
                timeText.innerHTML = currentTime
            }
            setInterval(updateTime, 1000);
        </script>
    </body>


</html>
